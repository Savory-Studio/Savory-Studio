server:
  port: 8080

spring:
  application:
    name: apg-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0}
    username: ${DB_USER:postgres.fklmbyqcsdrroppajnyo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  simulated-auth:
    enabled: true
    token: ${TEST_AUTH_TOKEN:test-token}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
    from-email: ${MAIL_FROM:no-reply@savorystudio.com}

jwt:
  secret: ${JWT_SECRET:MiClaveSuperSecretaYLoSuficientementeLargaParaHS25612345}
  expiration: ${JWT_EXPIRATION:86400000}